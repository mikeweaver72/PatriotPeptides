<main id="main">
<section class="wrap pad"><div class="authcard wide">
<span class="kick">Bulk &amp; lab quantities</span><h1 class="serif">Bulk request</h1><p class="muted">1 kit = 10 vials. This is a request only: no order is placed and nothing is charged.</p>
<form class="form" data-form="bulk"><div class="g2"><label>Name<input name="name" maxlength="120" required autocomplete="name"></label><label>Company / organization<input name="company" maxlength="160" autocomplete="organization"></label></div>

<label>Special requirements / notes<textarea name="requirements" maxlength="2000" placeholder="Tell us about your request"></textarea></label>
<label class="chk"><input type="checkbox" name="ack" required> I understand the products are for legitimate laboratory research only, not human or veterinary use, and that submitting this request does not place an order or guarantee availability.</label>
<button class="btn primary wide" type="submit">Send bulk request</button><p class="notice" data-msg hidden role="status"></p></form>
</div></section>
